name: Lab 7 Kubernetes Cluster Test

on:
  workflow_dispatch:

jobs:
  test-cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create Kubernetes cluster
        run: kind create cluster --name lab7

      - name: Check nodes
        run: kubectl get nodes -o wide

      - name: Check system pods
        run: kubectl get pods -A


      - name: Deploy and test Redis
        run: |
          kubectl apply -f redis/redis-deployment.yaml
          kubectl apply -f redis/redis-service.yaml
          kubectl rollout status deployment/redis --timeout=120s
          kubectl get pods -o wide
          kubectl get services
          kubectl exec deployment/redis -- redis-cli ping


      - name: Deploy and test MinIO
        run: |
          PASSWORD=$(openssl rand -hex 24)
          kubectl create secret generic minio-auth \
            --from-literal=username=lab7admin \
            --from-literal=password="$PASSWORD"

          kubectl apply -f minio/minio-deployment.yaml
          kubectl apply -f minio/minio-service.yaml

          kubectl rollout status deployment/minio --timeout=180s
          kubectl get pods
          kubectl get service minio

          kubectl run minio-check --rm -i \
            --restart=Never \
            --image=curlimages/curl:8.11.1 \
            -- http://minio:9000/minio/health/live

          echo "MINIO KUBERNETES TEST PASSED"


      - name: Diagnose MinIO failure
        if: failure()
        run: |
          echo "===== POD STATUS ====="
          kubectl get pods -o wide || true

          echo "===== MINIO POD DETAILS ====="
          kubectl describe pods -l app=minio || true

          echo "===== MINIO LOGS ====="
          kubectl logs deployment/minio --all-containers=true --tail=100 || true

          echo "===== PREVIOUS LOGS ====="
          kubectl logs deployment/minio --previous --tail=100 || true

          echo "===== KUBERNETES EVENTS ====="
          kubectl get events --sort-by=.metadata.creationTimestamp || true

      - name: Check available resources
        run: |
          free -h
          df -h .
