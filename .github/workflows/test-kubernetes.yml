name: Lab 7 Kubernetes Cluster Test

on:
  workflow_dispatch:

jobs:
  test-cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create Kubernetes cluster
        run: kind create cluster --name lab7

      - name: Check nodes
        run: kubectl get nodes -o wide

      - name: Check system pods
        run: kubectl get pods -A


      - name: Deploy and test Redis
        run: |
          kubectl apply -f redis/redis-deployment.yaml
          kubectl apply -f redis/redis-service.yaml
          kubectl rollout status deployment/redis --timeout=120s
          kubectl get pods -o wide
          kubectl get services
          kubectl exec deployment/redis -- redis-cli ping


      - name: Check MinIO image availability
        run: |
          docker pull dappros/minio:RELEASE.2025-09-07T16-13-09Z
          docker image inspect dappros/minio:RELEASE.2025-09-07T16-13-09Z --format '{{.Id}}'

      - name: Deploy and test MinIO
        run: |
          PASSWORD=$(openssl rand -hex 24)
          kubectl create secret generic minio-auth \
            --from-literal=username=lab7admin \
            --from-literal=password="$PASSWORD"

          kubectl apply -f minio/minio-deployment.yaml
          kubectl apply -f minio/minio-service.yaml

          kubectl rollout status deployment/minio --timeout=180s
          kubectl get pods
          kubectl get service minio

          kubectl run minio-check --rm -i \
            --restart=Never \
            --image=curlimages/curl:8.11.1 \
            -- http://minio:9000/minio/health/live

          echo "MINIO KUBERNETES TEST PASSED"


      - name: Diagnose MinIO failure
        if: failure()
        run: |
          echo "===== POD STATUS ====="
          kubectl get pods -o wide || true

          echo "===== MINIO POD DETAILS ====="
          kubectl describe pods -l app=minio || true

          echo "===== MINIO LOGS ====="
          kubectl logs deployment/minio --all-containers=true --tail=100 || true

          echo "===== PREVIOUS LOGS ====="
          kubectl logs deployment/minio --previous --tail=100 || true

          echo "===== KUBERNETES EVENTS ====="
          kubectl get events --sort-by=.metadata.creationTimestamp || true


      - name: Build and deploy REST
        run: |
          docker build -f rest/Dockerfile -t lab7-rest:test .
          kind load docker-image lab7-rest:test --name lab7

          kubectl apply -f rest/rest-deployment.yaml
          kubectl apply -f rest/rest-service.yaml

          kubectl rollout status deployment/rest --timeout=120s
          kubectl get pods
          kubectl get service rest

          kubectl run rest-check --rm -i \
            --restart=Never \
            --image=curlimages/curl:8.11.1 \
            -- http://rest:5000/

          echo "REST KUBERNETES TEST PASSED"


      - name: Initialize MinIO buckets
        run: |
          kubectl exec deployment/rest -- python -c '
          import os
          from minio import Minio
          m = Minio("minio:9000",
              access_key=os.environ["MINIO_ACCESS_KEY"],
              secret_key=os.environ["MINIO_SECRET_KEY"],
              secure=False)
          for bucket in ("queue", "output"):
              if not m.bucket_exists(bucket):
                  m.make_bucket(bucket)
              print("Ready:", bucket)
          '

      - name: Build and deploy Worker
        run: |
          docker build -f worker/Dockerfile -t lab7-worker:test .
          kind load docker-image lab7-worker:test --name lab7
          kubectl apply -f worker/worker-deployment.yaml
          kubectl rollout status deployment/worker --timeout=180s
          kubectl get pods -o wide
          echo "WORKER DEPLOYED"

      - name: Full end-to-end MP3 test
        timeout-minutes: 10
        run: |
          kubectl port-forward service/rest 5000:5000 > /tmp/rest-forward.log 2>&1 &
          sleep 5
          python - <<'TEST'
          import base64, json, time, urllib.request
          from pathlib import Path

          base = "http://127.0.0.1:5000"
          mp3 = Path("data/short-dreams.mp3").read_bytes()

          payload = json.dumps({
              "mp3": base64.b64encode(mp3).decode()
          }).encode()

          req = urllib.request.Request(
              base + "/apiv1/separate",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              result = json.load(r)

          songhash = result["hash"]
          print("Song hash:", songhash, flush=True)

          tracks = ("bass", "drums", "vocals", "other")
          deadline = time.monotonic() + 420

          while time.monotonic() < deadline:
              completed = []
              for track in tracks:
                  url = f"{base}/apiv1/track/{songhash}/{track}.mp3"
                  try:
                      with urllib.request.urlopen(url, timeout=20) as r:
                          audio = r.read()
                      if len(audio) > 1000:
                          completed.append(track)
                  except Exception:
                      pass

              print("Available tracks:", completed, flush=True)
              if len(completed) == 4:
                  print("FULL END-TO-END TEST PASSED", flush=True)
                  break

              time.sleep(15)
          else:
              raise RuntimeError("Four real MP3 outputs were not ready")
          TEST

      - name: Show final Kubernetes evidence
        if: always()
        run: |
          kubectl get pods -o wide || true
          kubectl get deployments,services || true
          kubectl logs deployment/worker --tail=100 || true
          kubectl logs deployment/rest --tail=40 || true
          kubectl get events --sort-by=.metadata.creationTimestamp | tail -30 || true


      - name: Validate REST Ingress
        run: |
          kubectl apply --dry-run=client -f rest/rest-ingress.yaml
          kubectl apply -f rest/rest-ingress.yaml
          kubectl get ingress frontend-ingress
          echo "INGRESS MANIFEST VALIDATED"

      - name: Check available resources
        run: |
          free -h
          df -h .
